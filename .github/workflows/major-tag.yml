name: Move major tag

# Pushing an immutable tag such as v1.2.3 moves the floating v1 tag to the same commit.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  major:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
